  <meta property="og:description" content="올해를 마무리하는 작은 모임에 당신을 초대합니다. 마음속에 남겨둔 이야기를 카드에 적고, 우리의 트리에 하나씩 걸어주세요." />

  <meta name="twitter:description" content="올해를 마무리하는 작은 모임에 당신을 초대합니다. 마음속에 남겨둔 이야기를 카드에 적고, 우리의 트리에 하나씩 걸어주세요." />
  <meta name="twitter:image" content="https://december-club-nine.vercel.app/assets/og-image.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <style>
    @font-face {
      font-family: 'GeuriunXKukhanbakTture';
      src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@x-7/x/GriunXHangeulDDURAE-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'ChosunIlboMyungjo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Chosunilbo_myungjo.woff') format('woff');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --navy: #001c5f;
      --navy-center: #0a2a78;   /* 중앙: 살짝 밝게 */
      --navy-edge: #000b2a;     /* 모서리: 살짝 어둡게 */
      --thread: #e9dcc0;        /* 카드를 매단 실 */
      --gold: #d8b56a;
      --gold-dark: #8a6a2c;
      --cream: #e9dcc0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      overflow: hidden;
      background-color: var(--navy);
      background-image: radial-gradient(
        ellipse 75% 70% at 50% 50%,
        var(--navy-center) 0%,
        var(--navy) 55%,
        var(--navy-edge) 100%
      );
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage { position: fixed; inset: 0; }

    /* ── 눈길 장면 ── */
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0;
      transition: opacity 1.4s ease .3s;
    }
    .scene.is-on { opacity: 1; }

    /* ── 눈 레이어: 뒤 / 앞 ── */
    .snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .snow--back  { z-index: 1; }
    .snow--front { z-index: 3; }

    /* ── 인트로 카드 ── */
    .drop {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 2;
      opacity: 0;
      transform: translate(-50%, -40px);
      animation: drop-in 1.8s cubic-bezier(.2, .7, .2, 1) .2s forwards;
    }
    @keyframes drop-in {
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    /* 퇴장: 실에 끌려 위로 올라감 */
    .drop.is-leaving {
      animation: drop-out 1.4s cubic-bezier(.55, 0, .75, .2) forwards;
    }
    @keyframes drop-out {
      from { opacity: 1; transform: translate(-50%, 0); }
      70%  { opacity: 1; }
      to   { opacity: 0; transform: translate(-50%, -105vh); }
    }

    .pendulum {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: 50% 0;
      will-change: transform;
    }

    .thread {
      width: 1.5px;
      height: var(--thread-len, 120px);
      background: linear-gradient(to bottom, rgba(233, 220, 192, 0) 0%, var(--thread) 30%, var(--thread) 100%);
      box-shadow: 0 0 6px rgba(255, 240, 210, 0.25);
    }

    .ring {
      position: relative;
      z-index: 1;
      width: 14px;
      height: 14px;
      margin-top: -2px;
      margin-bottom: -10px;
      border-radius: 50%;
      border: 2.5px solid var(--gold);
      box-shadow: inset 0 0 0 0.5px var(--gold-dark), 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .card {
      display: block;
      width: min(70vw, 448px, calc(69vh * 987 / 1247));
      height: auto;
      aspect-ratio: 987 / 1247;
      filter: drop-shadow(0 24px 40px rgba(0, 6, 28, 0.55))
              drop-shadow(0 0 60px rgba(120, 160, 255, 0.10));
      cursor: pointer;
      -webkit-user-drag: none;
    }

    /* ── 안내 문구 ── */
    .hint {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 4;
      transform: translateX(-50%);
      font: italic 13px/1 Georgia, 'Times New Roman', serif;
      letter-spacing: 0.04em;
      color: rgba(233, 220, 192, 0.7);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .hint--intro { animation: hint-in 1s ease .6s forwards; }
    .hint.is-on { opacity: 1; }
    .hint.is-hidden { opacity: 0 !important; animation: none; }
    @keyframes hint-in { to { opacity: 1; } }

    /* 눈길 장면 안내: 어두운 하늘 쪽(위)에 표시 */
    .hint--walk {
      top: max(22px, env(safe-area-inset-top));
      bottom: auto;
      color: rgba(233, 220, 192, 0.75);
    }
    .hint--walk .touch { display: none; }
    @media (pointer: coarse) {
      .hint--walk .keys  { display: none; }
      .hint--walk .touch { display: inline; }
    }

    /* ── 터치 조이스틱 (화면 왼쪽을 누른 자리에 나타남) ── */
    .joy {
      position: fixed;
      z-index: 4;
      width: 104px;
      height: 104px;
      margin: -52px 0 0 -52px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(0, 28, 95, 0.22);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .joy.is-on { opacity: 1; }
    .joy__knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      transform: translate(-50%, -50%);
    }

    /* ── 캐럴 켜기/끄기 ── */
    .music {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 5;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(233, 220, 192, 0.45);
      background: rgba(0, 20, 70, 0.35);
      color: var(--cream);
      font: 18px/1 Georgia, serif;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease, background .2s ease;
    }
    .music.is-on { opacity: 1; pointer-events: auto; }
    .music:hover { background: rgba(0, 28, 95, 0.6); }
    .music[aria-pressed="false"] { color: rgba(233, 220, 192, 0.45); text-decoration: line-through; }
    /* 언어 바꾸기 (KO · EN) — 인트로에서도 보이게 늘 떠 있음 */
    .lang {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: calc(max(14px, env(safe-area-inset-right)) + 50px);
      z-index: 30;
      height: 40px;
      padding: 0 12px;
      display: inline-flex; align-items: center; gap: 2px;
      border-radius: 20px;
      border: 1px solid rgba(233, 220, 192, 0.45);
      background: rgba(0, 20, 70, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: rgba(233, 220, 192, 0.5);
      font: 12px/1 Georgia, serif;
      letter-spacing: 0.08em;
      cursor: pointer;
    }
    .lang:hover { background: rgba(0, 28, 95, 0.6); }
    .lang span { padding: 4px 5px; border-radius: 10px; transition: color .2s ease, background .2s ease; }
    .lang[data-lang="ko"] span[lang="ko"], .lang[data-lang="en"] span[lang="en"] { color: #0b2a6a; background: var(--cream); }
    /* 좁은 화면: 멤버 배지와 겹치지 않게 음악 버튼 아래로 */
    @media (max-width: 640px) {
      .lang { top: calc(max(14px, env(safe-area-inset-top)) + 48px); right: max(14px, env(safe-area-inset-right)); height: 32px; padding: 0 6px; font-size: 11px; }
    }

    /* ── 트리 근처 안내 버튼 ── */
    .nearby {
      position: fixed;
      left: 50%;
      bottom: max(26px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 5;
      transform: translate(-50%, 10px);
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 220, 160, 0.6);
      background: rgba(0, 20, 70, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff3dc;
      font: 15px/1 'ChosunIlboMyungjo', Georgia, serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
      box-shadow: 0 0 24px rgba(255, 190, 110, 0.25);
    }
    .nearby.is-on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    /* 눈 굴리기 버튼 (오른쪽 아래) — 누르고 있는 동안은 밝게 */
    .roll {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 12px));
      z-index: 5;
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255, 220, 160, 0.55);
      background: rgba(0, 20, 70, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff3dc;
      font-size: 26px; line-height: 1;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease, background .2s ease, box-shadow .2s ease;
    }
    .roll.is-on { opacity: 1; pointer-events: auto; }
    /* 눈 던지기 버튼 — 굴리기 버튼 위 */
    .roll.throw { bottom: max(88px, calc(env(safe-area-inset-bottom) + 76px)); font-size: 24px; }
    .roll.throw:active { background: rgba(255, 243, 220, 0.9); color: #0b2a6a; }
    .roll[aria-pressed="true"] { background: rgba(255, 243, 220, 0.9); color: #0b2a6a; box-shadow: 0 0 22px rgba(255, 230, 190, 0.7); }
    .nearby kbd {
      margin-left: 8px;
      padding: 2px 6px;
      border: 1px solid rgba(255, 243, 220, 0.5);
      border-radius: 4px;
      font: 11px/1 Georgia, serif;
    }
    @media (pointer: coarse) { .nearby kbd { display: none; } }

    /* ── 내 클럽 멤버 번호 ── */
    .member {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      top: max(16px, env(safe-area-inset-top));
      z-index: 5;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 220, 160, 0.45);
      background: rgba(0, 20, 70, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff3dc;
      font: italic 14px/1 Georgia, serif;
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity .8s ease;
      pointer-events: none;
      cursor: pointer;
    }
    .member.is-on { opacity: 1; pointer-events: auto; }
    .member.is-on:hover { border-color: rgba(255, 220, 160, 0.8); }
    .member::after { content: ' ✎'; font-style: normal; font-size: 0.85em; opacity: 0.6; }

    /* ── 닉네임 정하기 ── */
    .nick {
      position: fixed; inset: 0; z-index: 30;
      display: grid; place-items: center;
      padding: 16px;
      background: rgba(4, 14, 44, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      animation: nick-in .5s ease both;
    }
    .nick[hidden] { display: none; }
    @keyframes nick-in { from { opacity: 0; } }
    .nick__card {
      width: min(360px, 100%);
      padding: 28px 24px 22px;
      border-radius: 16px;
      background: #fbf5ea;
      border: 2px solid rgba(194, 69, 63, 0.55);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
      color: #5b2a24;
      font-family: 'ChosunIlboMyungjo', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    }
    .nick__title { margin: 0 0 8px; font-size: 20px; font-weight: normal; color: #c2453f; }
    .nick__desc { margin: 0 0 18px; font-size: 13px; line-height: 1.6; opacity: 0.8; word-break: keep-all; }
    .nick__input {
      width: 100%; box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid rgba(194, 69, 63, 0.45);
      border-radius: 10px;
      background: #fffdf8;
      color: #5b2a24;
      font: 20px 'GeuriunXKukhanbakTture', 'ChosunIlboMyungjo', serif;
      text-align: center;
      outline: none;
    }
    .nick__input:focus { border-color: #c2453f; box-shadow: 0 0 0 3px rgba(194, 69, 63, 0.15); }
    .nick__err { min-height: 1.4em; margin: 8px 0 4px; font-size: 12px; color: #c2453f; }
    .nick__actions { display: flex; gap: 8px; justify-content: center; }
    .nick__actions button {
      padding: 10px 22px; border-radius: 999px; cursor: pointer;
      font: 15px/1 'ChosunIlboMyungjo', Georgia, serif;
    }
    .nick__go { border: 0; background: #c2453f; color: #fff6ea; }
    .nick__go:disabled { opacity: 0.6; cursor: default; }
    .nick__cancel { border: 1px solid rgba(194, 69, 63, 0.5); background: transparent; color: #c2453f; }
    .nick[data-first] .nick__cancel { display: none; }
    .member { white-space: nowrap; }
    /* 좁은 화면: 배지를 작게, 안내 문구는 배지 아래로 */
    @media (max-width: 640px) {
      .member { font-size: 12px; padding: 7px 12px; }
      .hint--walk { top: max(62px, calc(env(safe-area-inset-top) + 48px)); font-size: 12px; }
    }
    .member b { font-style: normal; color: #ffd27a; }
    .welcome {
      position: fixed;
      left: 50%;
      top: 22%;
      z-index: 6;
      transform: translate(-50%, 8px);
      text-align: center;
      color: #fff3dc;
      font: italic 30px/1.3 Georgia, serif;
      text-shadow: 0 0 22px rgba(255, 190, 110, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease, transform 1s ease;
      white-space: nowrap;
    }
    .welcome small { display: block; font: 14px/1.6 'ChosunIlboMyungjo', Georgia, serif; letter-spacing: 0.04em; opacity: 0.85; }
    /* 새해까지 남은 날 — 올 풀린 천 조각 위 빨간 십자수 (js/stitch.js 가 canvas 로 그림) + 뒤로 은은한 붉은 빛 */
    .welcome__dday {
      display: block;
      margin: 0 auto 6px;
      padding: 10px 30px 4px;
      font: 64px/1.1 'Lobster', cursive;
      font-style: normal;
      color: #e8303a;
      background: radial-gradient(ellipse 52% 55% at 50% 50%, rgba(255, 80, 70, 0.45), rgba(255, 80, 70, 0.12) 58%, rgba(255, 80, 70, 0) 76%);
    }
    .welcome__dday canvas {
      display: block;
      margin: 0 auto;
      max-width: 82vw;
      height: auto;
      transform: rotate(-2.5deg);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 20, 0.45)) drop-shadow(0 0 26px rgba(255, 90, 80, 0.4));
    }
    @media (max-width: 640px) { .welcome { font-size: 24px; } }
    .welcome.is-on { opacity: 1; transform: translate(-50%, 0); }
    .letter-actions button[hidden] { display: none !important; }

    /* ── 편지 카드 ── */
    .letter-modal {
      --paper-ink: #5b2a24;
      --paper-red: #c2453f;
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 16px;
      font-family: 'GeuriunXKukhanbakTture', 'ChosunIlboMyungjo', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    }
    .letter-modal[hidden] { display: none; }
    .letter-modal__backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 28, 95, 0.55), rgba(0, 8, 32, 0.85));
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      transition: opacity .35s ease;
    }
    .letter-modal.is-open .letter-modal__backdrop { opacity: 1; }
    .letter-modal__close {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 2;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 20, 70, 0.4);
      color: #fff;
      font: 22px/1 Georgia, serif;
      cursor: pointer;
    }

    .letter {
      position: relative;
      z-index: 1;
      height: min(70vh, calc((100vw - 32px) / var(--ar-n, 0.7687)), 720px);
      aspect-ratio: var(--ar, 1047 / 1362);
      perspective: 1600px;
      container-type: inline-size;
      opacity: 0;
      transform: translateY(30px) scale(0.92);
      transition: opacity .35s ease, transform .45s cubic-bezier(.2, .8, .2, 1.1);
    }
    .letter-modal.is-open .letter { opacity: 1; transform: none; }
    .letter.is-hanging {
      transition: transform .65s cubic-bezier(.6, 0, .8, .4), opacity .65s ease;
      transform: translateY(-30vh) scale(0.15) rotate(-12deg) !important;
      opacity: 0 !important;
    }
    .letter.is-rerolled .letter__q { animation: q-in .45s ease; }
    @keyframes q-in { from { opacity: 0; transform: translateY(6px); } }

    .letter__inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform .8s cubic-bezier(.3, .7, .2, 1);
    }
    .letter.is-flipped .letter__inner { transform: rotateY(180deg); }

    .letter__face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: url('assets/letter.webp') center / 100% 100% no-repeat;
      filter: drop-shadow(0 18px 30px rgba(0, 6, 28, 0.5));
      color: var(--paper-ink);
      text-align: center;
    }
    .letter__face--front { cursor: pointer; }
    .letter__face--back { transform: rotateY(180deg); }

    /* 앞면: 머리 부분에 사진, 몸통 부분에 질문 */
    .letter__photo {
      position: absolute;
      left: 50%;
      top: 3.5%;
      height: 32%;
      transform: translateX(-50%);
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .letter__tag {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 45%;
      font-size: 3.4cqw;
      letter-spacing: 0.08em;
      color: var(--paper-red);
    }
    .letter__tag .js-tree { font-family: Georgia, serif; font-style: italic; letter-spacing: 0.04em; }
    .letter__q {
      position: absolute;
      left: 15%;
      right: 15%;
      top: 51%;
      bottom: 22%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5.4cqw;
      line-height: 1.6;
      word-break: keep-all;
    }
    .letter__flip-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 9%;
      font-size: 3cqw;
      color: rgba(91, 42, 36, 0.55);
    }

    /* 뒷면: 머리 부분에 질문, 몸통 부분에 답변 */
    .letter__q-small {
      position: absolute;
      left: 24%;
      right: 24%;
      top: 9%;
      height: 22%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.7cqw;
      line-height: 1.55;
      word-break: keep-all;
      color: var(--paper-red);
    }
    .letter__answer,
    .letter__answer-view {
      position: absolute;
      left: 14%;
      right: 14%;
      top: 42%;
      height: 42%;
      padding: 0 1cqw;
      border: 0;
      outline: none;
      resize: none;
      background:
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.05em - 1px), rgba(194, 69, 63, 0.28) calc(2.05em - 1px), rgba(194, 69, 63, 0.28) 2.05em);
      background-attachment: local;
      color: var(--paper-ink);
      font: 4.4cqw/2.05em 'GeuriunXKukhanbakTture', 'ChosunIlboMyungjo', 'Nanum Myeongjo', 'AppleMyungjo', serif;
      text-align: left;
      word-break: keep-all;
      white-space: pre-wrap;
      overflow-y: auto;
      user-select: text;
      -webkit-user-select: text;
      touch-action: auto;
    }
    .letter__answer::placeholder { color: rgba(91, 42, 36, 0.38); }
    .letter__answer-view[hidden], .letter__answer[hidden] { display: none; }
    .letter__count, .letter__date {
      position: absolute;
      right: 16%;
      bottom: 9%;
      font-size: 2.8cqw;
      color: rgba(91, 42, 36, 0.5);
    }
    .letter__date { right: auto; left: 16%; }
    /* Family: 체크무늬 지붕 집 카드 — 앞면 지붕은 무늬, 몸통에 질문 / 뒷면 지붕에 질문, 몸통에 답 */
    /* 가족 사진: 지붕 아래쪽에 서서 집 앞을 걸어가는 모습 */
    .letter-modal[data-tree="Family"] .letter__photo { top: 20%; height: 34%; filter: drop-shadow(0 3px 4px rgba(60, 20, 10, 0.25)); }
    .letter-modal[data-tree="Family"] .letter__tag { left: 19%; right: 19%; top: 56.5%; font-size: 2.9cqw; }
    .letter-modal[data-tree="Family"] .letter__q { left: 20%; right: 20%; top: 61%; bottom: 11%; font-size: 4.2cqw; }
    .letter-modal[data-tree="Family"] .letter__flip-hint { bottom: 4.5%; font-size: 2.5cqw; }
    .letter-modal[data-tree="Family"] .letter__q-small { left: 32%; right: 32%; top: 19%; height: 26%; font-size: 2.8cqw; }
    .letter-modal[data-tree="Family"] .letter__answer,
    .letter-modal[data-tree="Family"] .letter__answer-view { left: 21%; right: 21%; top: 53%; height: 31%; font-size: 3.4cqw; }
    .letter-modal[data-tree="Family"] .letter__from { left: 21%; right: 21%; top: 86%; font-size: 2.6cqw; }
    .letter-modal[data-tree="Family"] .letter__count,
    .letter-modal[data-tree="Family"] .letter__date { bottom: 4%; font-size: 2.3cqw; }
    .letter-modal[data-tree="Family"] .letter__count { right: 21%; }
    .letter-modal[data-tree="Family"] .letter__date { left: 21%; }
    /* Growth: 진저브레드 모양 크림색 편지지 — 머리에 질문, 팔·몸통에 답 */
    .letter-modal[data-tree="Growth"] .letter__face { color: #5b2a24; }
    .letter-modal[data-tree="Growth"] .letter__tag { left: 26%; right: 26%; top: 12.5%; font-size: 3cqw; color: #c2453f; }
    .letter-modal[data-tree="Growth"] .letter__q { left: 26%; right: 26%; top: 17%; bottom: 66%; font-size: 3.9cqw; line-height: 1.5; }
    .letter-modal[data-tree="Growth"] .letter__flip-hint { bottom: 24%; font-size: 2.6cqw; color: rgba(194, 69, 63, .75); }
    .letter-modal[data-tree="Growth"] .letter__q-small { left: 30%; right: 30%; top: 12%; height: 21%; font-size: 3cqw; color: #c2453f; }
    .letter-modal[data-tree="Growth"] .letter__answer,
    .letter-modal[data-tree="Growth"] .letter__answer-view {
      left: 20%; right: 20%; top: 37%; height: 27%; font-size: 3.7cqw; color: #5b2a24;
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.05em - 1px), rgba(194, 69, 63, 0.22) calc(2.05em - 1px), rgba(194, 69, 63, 0.22) 2.05em);
    }
    .letter-modal[data-tree="Growth"] .letter__answer::placeholder { color: rgba(91, 42, 36, 0.4); }
    .letter-modal[data-tree="Growth"] .letter__from { left: 28%; right: 28%; top: 67%; font-size: 2.9cqw; color: #c2453f; }
    .letter-modal[data-tree="Growth"] .letter__count,
    .letter-modal[data-tree="Growth"] .letter__date { bottom: 2.5%; font-size: 2.5cqw; color: rgba(194, 69, 63, .75); }
    .letter-modal[data-tree="Growth"] .letter__count { right: 22%; bottom: 4%; }
    .letter-modal[data-tree="Growth"] .letter__date { left: 22%; bottom: 4%; }
    /* Feeling: 크리스마스 양말 카드 — 앞면 접단에 태그, 다리에 질문 / 뒷면 접단에 질문, 다리·발에 답 */
    .letter-modal[data-tree="Feeling"] .letter__face { color: #5b2a24; }
    .letter-modal[data-tree="Feeling"] .letter__tag { left: 37%; right: 8%; top: 16%; font-size: 3.2cqw; color: #c2453f; }
    .letter-modal[data-tree="Feeling"] .letter__q { left: 33%; right: 14%; top: 31%; bottom: 40%; font-size: 4.6cqw; line-height: 1.55; }
    .letter-modal[data-tree="Feeling"] .letter__flip-hint { left: 8%; right: 18%; bottom: 13%; font-size: 3cqw; color: rgba(194, 69, 63, .75); }
    .letter-modal[data-tree="Feeling"] .letter__q-small { left: 37%; right: 8%; top: 11%; height: 15%; font-size: 3.1cqw; color: #c2453f; }
    .letter-modal[data-tree="Feeling"] .letter__answer,
    .letter-modal[data-tree="Feeling"] .letter__answer-view {
      left: 37%; right: 14%; top: 32%; height: 32%; font-size: 3.8cqw; color: #5b2a24;
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.05em - 1px), rgba(194, 69, 63, 0.22) calc(2.05em - 1px), rgba(194, 69, 63, 0.22) 2.05em);
    }
    .letter-modal[data-tree="Feeling"] .letter__answer::placeholder { color: rgba(91, 42, 36, 0.4); }
    .letter-modal[data-tree="Feeling"] .letter__from { left: 14%; right: 18%; top: 68%; font-size: 3.2cqw; color: #c2453f; }
    .letter-modal[data-tree="Feeling"] .letter__count,
    .letter-modal[data-tree="Feeling"] .letter__date { bottom: 15%; font-size: 2.7cqw; color: rgba(194, 69, 63, .75); }
    .letter-modal[data-tree="Feeling"] .letter__count { right: 24%; }
    .letter-modal[data-tree="Feeling"] .letter__date { left: 14%; }
    /* Wish: 빨간 테두리 별 모양 카드 — 별 가운데에 질문 / 뒷면 위쪽에 질문, 가운데에 답 */
    .letter-modal[data-tree="Wish"] .letter__face { color: #5b2a24; }
    .letter-modal[data-tree="Wish"] .letter__tag { left: 26%; right: 26%; top: 24%; font-size: 3cqw; color: #c2453f; }
    .letter-modal[data-tree="Wish"] .letter__q { left: 22%; right: 22%; top: 30%; bottom: 32%; font-size: 4.2cqw; line-height: 1.55; }
    .letter-modal[data-tree="Wish"] .letter__flip-hint { bottom: 22%; font-size: 2.6cqw; color: rgba(194, 69, 63, .75); }
    .letter-modal[data-tree="Wish"] .letter__q-small { left: 31%; right: 31%; top: 17%; height: 17%; font-size: 2.8cqw; color: #c2453f; }
    .letter-modal[data-tree="Wish"] .letter__answer,
    .letter-modal[data-tree="Wish"] .letter__answer-view {
      left: 19%; right: 19%; top: 35%; height: 31%; font-size: 3.6cqw; color: #5b2a24;
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.05em - 1px), rgba(194, 69, 63, 0.22) calc(2.05em - 1px), rgba(194, 69, 63, 0.22) 2.05em);
    }
    .letter-modal[data-tree="Wish"] .letter__answer::placeholder { color: rgba(91, 42, 36, 0.4); }
    .letter-modal[data-tree="Wish"] .letter__from { left: 28%; right: 28%; top: 68%; font-size: 2.8cqw; color: #c2453f; }
    .letter-modal[data-tree="Wish"] .letter__count,
    .letter-modal[data-tree="Wish"] .letter__date { bottom: 21%; font-size: 2.4cqw; color: rgba(194, 69, 63, .75); }
    .letter-modal[data-tree="Wish"] .letter__count { right: 28%; }
    .letter-modal[data-tree="Wish"] .letter__date { left: 28%; }
    .letter__from {
      position: absolute;
      left: 16%;
      right: 16%;
      top: 35%;
      text-align: right;
      font-size: 3.2cqw;
      font-style: italic;
      color: var(--paper-red);
    }
    .letter-modal[data-mode="view"] .letter__count { display: none; }
    .letter-modal[data-mode="view"] .letter__flip-hint { visibility: hidden; }

    /* 아래 버튼들 (모드·면에 따라 바뀜) */
    .letter-actions {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 10px;
      opacity: 0;
      transition: opacity .35s ease .1s;
    }
    .letter-modal.is-open .letter-actions { opacity: 1; }
    .letter-actions button {
      display: none;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 243, 220, 0.55);
      background: rgba(0, 20, 70, 0.45);
      color: #fff3dc;
      font: 15px/1 'ChosunIlboMyungjo', Georgia, serif;
      cursor: pointer;
      white-space: nowrap;
    }
    .letter-actions button:hover { background: rgba(0, 28, 95, 0.75); }
    .letter-actions .is-primary { background: #c2453f; border-color: #c2453f; }
    .letter-actions .is-primary:hover { background: #d4544d; }
    .letter-actions button:disabled { opacity: 0.4; cursor: default; }
    .letter-modal[data-mode="write"][data-side="front"] :is(.js-reroll, .js-to-back),
    .letter-modal[data-mode="write"][data-side="back"] :is(.js-to-front, .js-hang),
    .letter-modal[data-mode="view"] :is(.js-flip, .js-remove) { display: inline-block; }
    .letter-modal[data-mode="write"][data-side="front"] .js-others,
    .letter-modal[data-mode="view"] .js-others { display: inline-block; }
    @media (max-width: 640px) { .letter-actions { flex-wrap: wrap; justify-content: center; max-width: 92vw; } }

    /* 같은 질문에 다른 사람들은 어떻게 답했는지 */
    .answers {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 8, 30, 0.55);
    }
    .answers[hidden] { display: none; }
    .answers__box {
      width: min(440px, 100%);
      max-height: min(76vh, 640px);
      display: flex;
      flex-direction: column;
      padding: 22px 20px 16px;
      border-radius: 14px;
      background: #fbf5ea;
      color: var(--paper-ink);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      font-family: 'GeuriunXKukhanbakTture', 'ChosunIlboMyungjo', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    }
    .answers__q { margin: 0 0 12px; color: var(--paper-red); font-size: 16px; line-height: 1.55; text-align: center; word-break: keep-all; }
    .answers__list { list-style: none; margin: 0; padding: 0 4px; overflow-y: auto; flex: 1; }
    .answers__list li { padding: 12px 2px; border-top: 1px dashed rgba(194, 69, 63, 0.35); }
    .answers__list p { margin: 0; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; }
    .answers__list small { display: block; margin-top: 6px; text-align: right; color: var(--paper-red); font: italic 13px Georgia, serif; }
    .answers__close {
      align-self: center;
      margin-top: 12px;
      padding: 9px 22px;
      border-radius: 999px;
      border: 1px solid var(--paper-red);
      background: transparent;
      color: var(--paper-red);
      font: 14px 'ChosunIlboMyungjo', Georgia, serif;
      cursor: pointer;
    }

    .snow { transition: opacity 1.4s ease; }
    .snow.is-off { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .drop { animation: none; opacity: 1; transform: translate(-50%, 0); }
      .drop.is-leaving { animation: none; opacity: 0; transition: opacity .6s; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <canvas class="scene" data-i18n-attr="aria-label=scene"></canvas>
    <canvas class="snow snow--back" aria-hidden="true"></canvas>

    <div class="drop">
      <div class="pendulum">
        <div class="thread" aria-hidden="true"></div>
        <div class="ring" aria-hidden="true"></div>
        <img class="card" src="assets/card.png" alt="You're invited — December Club. Let's look back on this year and welcome the next together." />
      </div>
    </div>

    <canvas class="snow snow--front" aria-hidden="true"></canvas>

    <p class="hint hint--intro" data-i18n="hint.intro">♪ tap to hear the bells</p>
    <p class="hint hint--walk"><span class="keys" data-i18n="hint.keys">WASD / ← ↑ → ↓ to walk · drag to look around · R to roll a snowball · F to throw</span><span class="touch" data-i18n="hint.touch">drag left side to walk · right side to look</span></p>
    <button class="roll throw" type="button" data-i18n-attr="aria-label=btn.throw, title=btn.throw">❄</button>
    <button class="roll" type="button" aria-pressed="false" data-i18n-attr="aria-label=btn.roll, title=btn.roll">☃</button>

    <button class="music" type="button" aria-pressed="true" data-i18n-attr="aria-label=btn.music, title=btn.music">♪</button>
    <button class="lang" type="button" data-i18n-attr="aria-label=btn.lang, title=btn.lang"><span lang="ko">KO</span><span lang="en">EN</span></button>
    <button class="member" type="button" aria-live="polite" data-i18n-attr="title=nick.change"></button>
    <form class="nick" hidden novalidate role="dialog" aria-modal="true" aria-labelledby="nick-title">
      <div class="nick__card">
        <h2 id="nick-title" class="nick__title" data-i18n="nick.title">닉네임을 정해 주세요</h2>
        <p class="nick__desc" data-i18n="nick.desc">트리에 거는 카드와 캐릭터 머리 위에 이 이름이 보여요</p>
        <input class="nick__input" name="nick" type="text" maxlength="12" autocomplete="nickname" enterkeyhint="go" spellcheck="false" data-i18n-attr="placeholder=nick.placeholder, aria-label=nick.title" />
        <p class="nick__err" role="alert"></p>
        <div class="nick__actions">
          <button class="nick__cancel" type="button" data-i18n="nick.cancel">취소</button>
          <button class="nick__go" type="submit" data-i18n="nick.go">입장하기</button>
        </div>
      </div>
    </form>
    <p class="welcome" aria-hidden="true"></p>
    <button class="nearby" type="button">✦ Friends<kbd>E</kbd></button>

    <div class="letter-modal" hidden data-mode="write" data-side="front" role="dialog" aria-modal="true" data-i18n-attr="aria-label=letter">
      <div class="letter-modal__backdrop"></div>
      <button class="letter-modal__close js-close" type="button" data-i18n-attr="aria-label=close">×</button>
      <div class="letter">
        <div class="letter__inner">
          <section class="letter__face letter__face--front" data-i18n-attr="aria-label=card.front">
            <img class="letter__photo" src="assets/friends.webp" alt="" />
            <p class="letter__tag"><span class="js-tree">Friends</span> · <span class="js-cat"></span></p>
            <p class="letter__q"></p>
            <p class="letter__flip-hint" data-i18n="flipHint">↻ 눌러서 뒤집기</p>
          </section>
          <section class="letter__face letter__face--back" data-i18n-attr="aria-label=card.back">
            <p class="letter__q-small"></p>
            <textarea class="letter__answer" rows="6" data-i18n-attr="placeholder=answer.placeholder, aria-label=answer"></textarea>
            <div class="letter__answer-view" hidden></div>
            <p class="letter__from"></p>
            <p class="letter__date"></p>
            <p class="letter__count"><span>0</span>/300</p>
          </section>
        </div>
      </div>
      <div class="letter-actions">
        <button class="js-reroll" type="button" data-i18n="act.reroll">↻ 다른 질문</button>
        <button class="js-to-back is-primary" type="button" data-i18n="act.toBack">뒤집어서 답하기</button>
        <button class="js-to-front" type="button" data-i18n="act.toFront">← 앞면</button>
        <button class="js-hang is-primary" type="button" disabled data-i18n="act.hang">✦ 트리에 달기</button>
        <button class="js-flip" type="button" data-i18n="act.flip">↻ 뒤집기</button>
        <button class="js-remove" type="button" data-i18n="act.remove">떼어내기</button>
        <button class="js-others" type="button" hidden>💬 같은 질문의 답</button>
      </div>
      <div class="answers" hidden role="dialog" data-i18n-attr="aria-label=answers">
        <div class="answers__box">
          <p class="answers__q"></p>
          <ul class="answers__list"></ul>
          <button class="answers__close" type="button" data-i18n="close">닫기</button>
        </div>
      </div>
    </div>

    <div class="joy" aria-hidden="true"><div class="joy__knob"></div></div>
  </main>

  <script src="js/sound.js"></script>
  <script src="js/snow.js"></script>
  <script src="js/intro.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/walk3d.js"></script>
</body>
</html>
