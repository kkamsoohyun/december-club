# Render 배포 설정 (render.com → New → Blueprint 에서 이 저장소를 고르면 자동으로 읽음)
services:
  - type: web
    name: december-club
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: python3 server.py
    healthCheckPath: /
    autoDeploy: true
    # 무료 플랜은 서버가 재시작되면 data/ 가 초기화됨.
    # 멤버 번호·카드를 영구 보관하려면 plan 을 starter 로 바꾸고 아래 주석을 풀기:
    # envVars:
    #   - key: DATA_DIR
    #     value: /var/data
    # disk:
    #   name: club-data
    #   mountPath: /var/data
    #   sizeGB: 1
